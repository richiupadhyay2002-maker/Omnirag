# Optional. Everything also runs fine without Docker (see README "Run locally").
# This compose file containerizes the backend + frontend; Ollama is expected to
# run on the host (recommended) so it can use your GPU. If you'd rather run
# Ollama in a container too, uncomment the "ollama" service below.

version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

