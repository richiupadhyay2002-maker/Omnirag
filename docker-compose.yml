# Optional. Everything also runs fine without Docker (see README "Run locally").
# This compose file containerizes the backend + frontend; Ollama is expected to
# run on the host (recommended) so it can use your GPU. If you'd rather run
# Ollama in a container too, uncomment the "ollama" service below.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Non-secret defaults (overridable via backend/.env or the shell).
      # Never put real API keys here — keep GROQ_API_KEY in backend/.env only.
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/app/data/chroma}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/data/uploads}
    volumes:
      - backend_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      # Build-time default; override via frontend/.env or the shell.
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  backend_data:
  # ollama_data:
